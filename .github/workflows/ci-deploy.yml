name: CI / Production Deploy

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'artifacts/**'
  push:
    paths-ignore:
      - '**.md'
      - 'artifacts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-production-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Validate frontend and backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository without LFS payloads
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: false

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            voice/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify Claude and Codex handoff contract
        run: npm run test:agent-handoff

      - name: Verify frozen overnight contracts
        run: npm run verify:overnight-freeze

      - name: Enforce UI copy invariants
        run: npm run check:ui-copy

      - name: Validate curated web data
        run: |
          npm run validate:data
          npm run test:facility-data

      - name: Validate deterministic synthetic CareOps data
        run: |
          npm run validate:synthetic-data
          npm run test:synthetic-data
          npm run test:contact-triage-schema

      - name: Test frontend operations contracts
        run: npm run test:ui

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Test backend with coverage gate
        run: npm --prefix backend run test:coverage

      - name: Install Chromium for operations E2E
        if: github.ref == 'refs/heads/main'
        run: npx playwright install --with-deps chromium

      - name: Test the surveyor-to-manager browser flows
        if: github.ref == 'refs/heads/main'
        run: npm run test:e2e:ops

      - name: Verify objective overnight UI evidence
        run: npm run verify:overnight

      - name: Upload operations browser evidence on failure
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contact-ops-browser-evidence
          path: |
            artifacts/playwright/
            artifacts/playwright-report/
            artifacts/screenshots/
            artifacts/axe/
            artifacts/p8-evidence.json
            test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Install voice-layer dependencies
        run: npm --prefix voice ci

      - name: Test text/file voice contracts and golden sets
        run: npm --prefix voice test

      - name: Build backend container
        run: docker build --file backend/Dockerfile --tag incheon-care-api:ci .

      - name: Smoke backend container operations routes
        shell: bash
        run: |
          set -euo pipefail
          container_name="incheon-care-api-ci-${GITHUB_RUN_ID}"
          docker run --detach --rm \
            --name "$container_name" \
            --publish 127.0.0.1:18084:8080 \
            --env CORS_ORIGINS=http://127.0.0.1:4175 \
            --env CONTACT_OPS_STATE_BACKEND=memory \
            incheon-care-api:ci >/dev/null
          trap 'docker stop "$container_name" >/dev/null 2>&1 || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18084/health >/tmp/container-health.json; then
              break
            fi
            if [[ "$attempt" -eq 20 ]]; then
              docker logs "$container_name"
              exit 1
            fi
            sleep 1
          done

          session_id="ci-container-session-${GITHUB_RUN_ID}"
          curl --fail --silent --show-error \
            --header "X-Demo-Session-ID: ${session_id}" \
            http://127.0.0.1:18084/api/v1/contact-ops/manager-breadth \
            >/tmp/container-manager-breadth.json
          curl --fail --silent --show-error \
            --header "X-Demo-Session-ID: ${session_id}" \
            http://127.0.0.1:18084/api/v1/contact-ops/operations-map \
            >/tmp/container-operations-map.json

          jq --exit-status \
            '.apiVersion == "v1" and .data.synthetic == true and .data.tuning_warning.current_mild_signal_count == 647' \
            /tmp/container-manager-breadth.json >/dev/null
          jq --exit-status \
            '.apiVersion == "v1"
             and .data.geometry_zone_count == 156
             and .data.current_admin_dong_count == 162
             and (.data.visit_review_points | length > 0)
             and any(.data.visit_review_points[]; .apartment_reference == true)
             and all(.data.visit_review_points[];
               .synthetic == true
               and .visit_approval_status == "권고"
               and (.road_address | startswith("인천광역시 "))
               and (.longitude | type == "number")
               and (.latitude | type == "number"))' \
            /tmp/container-operations-map.json >/dev/null
          [[ "$(docker exec "$container_name" id -u)" == "1000" ]]

  deploy-frontend-production:
    name: Deploy frontend production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: frontend-production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: 58.9.4

    steps:
      - name: Check out repository without LFS payloads
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: false

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Require Vercel repository secrets
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required repository secret: ${name}"
              exit 1
            fi
          done

      - name: Install locked dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Pull production environment and project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Require production API origin
        shell: bash
        run: |
          env_file=.vercel/.env.production.local
          expected='VITE_API_BASE_URL="https://incheon-care-api-vy3v2ludma-du.a.run.app"'
          if [[ ! -f "$env_file" ]] || ! grep --fixed-strings --line-regexp "$expected" "$env_file" >/dev/null; then
            echo "::error::Vercel production VITE_API_BASE_URL is missing or does not match the Cloud Run API"
            exit 1
          fi

      - name: Build Vercel output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Verify built frontend references the API
        shell: bash
        run: |
          api_origin='https://incheon-care-api-vy3v2ludma-du.a.run.app'
          built_asset="$(find .vercel/output/static/assets -maxdepth 1 -type f -name 'index-*.js' -print -quit)"
          if [[ -z "$built_asset" ]]; then
            echo "::error::Could not identify the built frontend entry asset"
            exit 1
          fi
          if ! grep --fixed-strings --quiet "$api_origin" "$built_asset"; then
            echo "::error::Built frontend entry asset does not reference the Cloud Run API"
            exit 1
          fi

      - name: Deploy Vercel output
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN")"
          echo "url=${deployment_url}" >> "$GITHUB_OUTPUT"
          echo "Frontend production: ${deployment_url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify public production alias references the API
        shell: bash
        run: |
          set -euo pipefail
          production_origin="https://incheon-care-map.vercel.app"
          app_html_file="$(mktemp)"
          asset_file="$(mktemp)"
          trap 'rm -f "$app_html_file" "$asset_file"' EXIT

          curl --fail --location --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            --output "$app_html_file" "${production_origin}/"
          app_html="$(cat "$app_html_file")"
          asset_path="$(printf '%s' "$app_html" | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)"
          if [[ -z "$asset_path" ]]; then
            echo "::error::Could not identify the production frontend entry asset"
            exit 1
          fi
          curl --fail --location --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            --output "$asset_file" "${production_origin}${asset_path}"
          if ! grep --fixed-strings --quiet \
            'https://incheon-care-api-vy3v2ludma-du.a.run.app' "$asset_file"; then
            echo "::error::Public production entry asset does not reference the Cloud Run API"
            exit 1
          fi

  deploy-backend-production:
    name: Deploy backend production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment:
      name: backend-production
      url: ${{ steps.deploy.outputs.url }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      REGISTRY_HOST: ${{ vars.GCP_REGION }}-docker.pkg.dev
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/api:${{ github.sha }}

    steps:
      - name: Check out repository without LFS payloads
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: false

      - name: Require Google Cloud repository variables
        shell: bash
        run: |
          required=(
            GCP_PROJECT_ID
            GCP_REGION
            GCP_ARTIFACT_REPOSITORY
            GCP_CLOUD_RUN_SERVICE
            GCP_WORKLOAD_IDENTITY_PROVIDER
            GCP_SERVICE_ACCOUNT
            GCP_RUNTIME_SERVICE_ACCOUNT
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required repository variable: ${name}"
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud with Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGISTRY_HOST" --quiet

      - name: Build Linux AMD64 backend image
        run: docker build --platform linux/amd64 --file backend/Dockerfile --tag "$IMAGE" .

      - name: Verify backend image platform
        shell: bash
        run: |
          platform="$(docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}')"
          if [[ "$platform" != "linux/amd64" ]]; then
            echo "::error::Expected linux/amd64 image, got ${platform}"
            exit 1
          fi

      - name: Push commit-SHA image
        run: docker push "$IMAGE"

      - name: Resolve pushed image digest
        id: image
        shell: bash
        run: |
          repository="${IMAGE%:*}"
          digest_image="$(
            gcloud artifacts docker images describe "$IMAGE" \
              --format='value(image_summary.fully_qualified_digest)'
          )"
          digest="${digest_image#"${repository}@"}"
          if [[ "$digest_image" != "${repository}@${digest}" ]] \
            || [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Artifact Registry did not return the expected image digest"
            exit 1
          fi
          echo "image=${digest_image}" >> "$GITHUB_OUTPUT"

      - name: Deploy backend to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          service: ${{ env.GCP_CLOUD_RUN_SERVICE }}
          image: ${{ steps.image.outputs.image }}
          env_vars: |-
            CORS_ORIGINS=https://incheon-care-map.vercel.app
            RATE_LIMIT_PER_MINUTE=30
            CONTACT_OPS_STATE_BACKEND=firestore
            CONTACT_OPS_FIRESTORE_COLLECTION=synthetic_contact_ops_sessions
            ENABLE_LIVE_CONTACT_OPS_AI=1
          env_vars_update_strategy: overwrite
          secrets: |-
            OPENAI_API_KEY=openai-api-key:latest
          secrets_update_strategy: merge
          flags: >-
            --cpu=1
            --memory=512Mi
            --concurrency=40
            --min-instances=0
            --max-instances=2
            --timeout=60s
            --cpu-throttling
            --cpu-boost
            --service-account=${{ env.GCP_RUNTIME_SERVICE_ACCOUNT }}
            --port=8080
            --ingress=all

      - name: Smoke-test deployed backend and CORS
        shell: bash
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
          ALLOWED_ORIGIN: https://incheon-care-map.vercel.app
        run: |
          set -euo pipefail
          if [[ -z "$SERVICE_URL" ]]; then
            echo "::error::Cloud Run deploy action did not return a service URL"
            exit 1
          fi

          service_url="${SERVICE_URL%/}"
          health_body="$(mktemp)"
          summary_body="$(mktemp)"
          summary_headers="$(mktemp)"
          trap 'rm -f "$health_body" "$summary_body" "$summary_headers"' EXIT

          curl_args=(
            --fail
            --silent
            --show-error
            --retry 36
            --retry-all-errors
            --retry-delay 5
            --connect-timeout 10
            --max-time 30
          )

          curl "${curl_args[@]}" --output "$health_body" "${service_url}/health"
          jq --exit-status \
            '.apiVersion == "v1" and .data.status == "ok"' \
            "$health_body" >/dev/null

          curl "${curl_args[@]}" \
            --header "Origin: ${ALLOWED_ORIGIN}" \
            --dump-header "$summary_headers" \
            --output "$summary_body" \
            "${service_url}/api/v1/summary"
          jq --exit-status \
            '.apiVersion == "v1" and (.data | type == "object")' \
            "$summary_body" >/dev/null
          tr -d '\r' < "$summary_headers" \
            | grep --fixed-strings --ignore-case --line-regexp \
              "access-control-allow-origin: ${ALLOWED_ORIGIN}" >/dev/null

          echo "Backend smoke tests: /health and summary CORS passed" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Record backend deployment
        run: |
          {
            echo "Backend image tag: ${IMAGE}"
            echo "Deployed image digest: ${{ steps.image.outputs.image }}"
            echo "Cloud Run service: ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
